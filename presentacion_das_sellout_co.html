    t7 += '<tr><td class="in">' + d.n + '</td><td>' + f0(d.si[1]) + '</td><td>' + (d.so[1] ? f0(d.so[1]) : '<span class="mut">—</span>') + '</td><td' + (d.part ? ' class="mut"' : '') + '>' + (d.so[1] ? f0(r) + '%' : '—') + '</td><td>' + (d.so[1] ? nt(d.si[1] - d.so[1], f0(Math.abs(d.si[1] - d.so[1]))) : '<span class="mut">—</span>') + '</td><td>' + pc(d.si[1], d.si[0]) + '</td><td>' + (d.part ? '<span class="mut">parcial</span>' : pc(d.so[1], d.so[0])) + '</td></tr>';
  });
});
t7 += '<tr class="sg"><td>8 DAS con reporte completo</td><td>' + f0(cSI) + '</td><td>' + f0(cSO) + '</td><td>' + f1(cSO / cSI * 100) + '%</td><td>' + nt(cSI - cSO, f0(cSI - cSO)) + '</td><td colspan="2"></td></tr>';
t7 += '<tr class="tt"><td>Total DAS Centro Oriente</td><td>' + f0(tSI[1]) + '</td><td>' + f0(tSO[1]) + '</td><td>' + f0(tSO[1] / tSI[1] * 100) + '%</td><td>' + nt(tSI[1] - tSO[1], f0(tSI[1] - tSO[1])) + '</td><td>' + pc(tSI[1], tSI[0]) + '</td><td>' + pc(tSO[1], tSO[0]) + '</td></tr></table>';
t7 += '<div class="cap">Sell in = facturación Backus a clientes con canal DAs (dm_cliente vigente). Sell out = venta del DAS a sus POCs (dm_das_venta). Un DAS puede tener varios códigos de cliente; se agrupan por nombre. SI − SO positivo = el DAS compró más de lo que vendió (sube su inventario). En 2026 el total de sell out incluye 3,116 HL de Ucayali Beer.</div>';
var b7s = '<div class="grid" style="grid-template-columns: 700px 1fr;"><div>' + t7 + '</div>' +
  '<div><div class="st">Brecha mensual sell in − sell out (HL), DAS con reporte</div>' +
  '<div class="legend" style="font-size:11.5px;gap:10px"><span><i style="border-top:8px solid #111;width:10px;vertical-align:-1px"></i>Sin Bonanza: carga</span><span><i style="border-top:8px solid #FFF200;outline:1px solid #b5ab00;width:10px;vertical-align:-1px"></i>Sin Bonanza: descarga</span><span><i style="border-top:8px solid #cfcfcf;width:10px;vertical-align:-1px"></i>Incluye Bonanza</span></div>' + gapChart() +
  '<ul class="b" style="margin-top:8px">' +
  '<li><b>Los DAS venden lo que compran:</b> sin Bonanza, los 8 DAS con reporte completo tienen un sell out del 99.8% de su sell in en 2026 (brecha de 1.6 mil HL). No hay sobrecarga de inventario.</li>' +
  '<li class="r"><b>La caída de Dismar Huánuco es demanda real:</b> el sell in cae −10.0% y el sell out −9.7%. No es un desinventario.</li>' +
  '<li class="r"><b>Bonanza (Iquitos) reporta solo el 73% de lo que compra</b> (+16.2 mil HL de brecha, +4.3 mil en Oct\'26). Puede ser stock o venta no reportada: validar con el DAS.</li>' +
  '</ul></div></div>';
H += slide('DAS Sell Out · Sell in vs sell out', 'Los DAS venden lo que les vendemos: el sell out es el 99.8% del sell in, salvo Bonanza', null, b7s, 7,
  'Fuente: dm_venta + dm_cliente (sell in a canal DAs) vs dm_das_venta + dm_das_cliente (sell out) · Beer+Rtds · YTD Ene-Oct');

// ---------- 8. Implicancias 1YP 2027 ----------
var b7 = '' +
  '<div class="act"><div class="nn">1</div><div class="tx"><b class="h">Recuperar el drop de Dismar Cinco Huánuco</b>Tiene más POCs que nunca (2,059), pero cada uno compra 15% menos. Volver a 6.16 HL/POC/mes (nivel 2025) con la base actual de POCs. Foco: Cristal en Off y On Tradicional.</div><div class="q"><div class="v">+22.6 mil</div><div class="l">HL/año potencial<br>(0.91 HL × 2,059 POCs × 12)</div></div></div>' +
  '<div class="act"><div class="nn">2</div><div class="tx"><b class="h">Defender Cristal frente a Pilsen Callao</b>Cristal cae −16.1 mil HL y Pilsen Callao crece +73.2 mil, con el canibalismo concentrado en los DAS de Huánuco y Huancayo. Revisar el gap de precio al POC entre ambas marcas en el canal DAS antes de mover descuentos (hipótesis a validar con PTC).</div><div class="q"><div class="v">16.1 mil</div><div class="l">HL de Cristal en juego<br>(YTD Ene-Oct)</div></div></div>' +
  '<div class="act"><div class="nn">3</div><div class="tx"><b class="h">Replicar el modelo Tarapoto en DA Jun Puc</b>Tarapoto subió +11% el volumen por POC con la misma base de clientes. Si DA Jun Puc capturara la mitad (+5% HL/POC sobre 7,821 POCs y 4.28 HL/POC/mes), el aporte sería el de la derecha.</div><div class="q"><div class="v">+20.1 mil</div><div class="l">HL/año potencial<br>(se superpone con la acción 1)</div></div></div>' +
  '<div class="act"><div class="nn">4</div><div class="tx"><b class="h">Iquitos: del arranque a la cobertura</b>Bonanza del Oriente ya da ~4.3 mil HL/mes, pero sus POCs están planos (~700-750) desde Set\'25. En 2027 la base es completa, así que el crecimiento debe venir de sumar POCs. Cada 100 POCs nuevos al drop actual (6.0 HL/mes) aportan el volumen de la derecha.</div><div class="q"><div class="v">+7.2 mil</div><div class="l">HL/año por cada<br>100 POCs nuevos</div></div></div>' +
  '<div class="act"><div class="nn">5</div><div class="tx"><b class="h">Capturar la ocasión fuera de casa</b>On Moderno (+67%) y eventeros (×4.9) son los segmentos más dinámicos. Incluir el calendario de eventos de los DAS en el plan 2027 y asegurar Rtds y Latas en esos puntos.</div><div class="q"><div class="v">+33.9 mil</div><div class="l">HL ya ganados YTD<br>en On Mod + eventeros</div></div></div>';
H += slide('DAS Sell Out · Implicancias para el 1YP 2027', 'Cinco palancas para el sell out DAS 2027', 'Potenciales en HL Beer+Rtds anualizados. Son órdenes de magnitud para dimensionar el plan; no se suman entre sí.', b7, 8,
  'Fuente: cálculo propio sobre dm_das_venta YTD Ene-Oct 2026 · drop = HL por POC comprador al mes · sell in vs sell out en lámina 7');
