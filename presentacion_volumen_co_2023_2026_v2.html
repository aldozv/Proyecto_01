  const kp = '<div style="font-size:12.5px;margin-bottom:4px">YTD Oct\'26: <b>' + f(ytd(a, 3)) + ' HL</b> · ' + [2, 1, 0].map(y => '<span class="' + cls(ytd(a, 3) - ytd(a, y)) + '">' + pc(ytd(a, 3), ytd(a, y)) + ' (' + sg(ytd(a, 3) - ytd(a, y)) + ') vs ' + (2023 + y) + '</span>').join(' · ') + '</div>';
  b.innerHTML = yearLegend + kp + '<div class="two"><div><div class="sec" style="margin-top:0">Por año (Ene–Dic)</div><div class="box" style="height:370px"><canvas></canvas></div></div><div><div class="sec" style="margin-top:0">Serie continua Ene\'23 – Oct\'26</div><div class="box" style="height:370px"><canvas></canvas></div></div></div><ul class="bul" style="margin-top:8px;font-size:13px">' + bul.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  const cv = b.querySelectorAll('canvas');
  lineYears(cv[0], a, true);
  new Chart(cv[1], {type: 'line', data: {labels: L46, datasets: [{data: a, borderColor: color, backgroundColor: fillC, fill: true, borderWidth: 2.5, pointRadius: 2, pointBackgroundColor: color, tension: .2}]},
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {grid: {display: false}, ticks: {autoSkip: false, maxRotation: 60, minRotation: 60, font: {size: 9}}}, y: {min: 0, grid: {color: GRID}, ticks: {callback: v => f(v)}}}}});
}

/* ---------- 14. v2 (15.11.26): Gerencia x brand pack ----------
   Fuente: querys/Query_CentroOriente_Volumen_BeerRtds_Gerencia_BrandPack_Mensual_2023_2026.sql (RGBP: mes, gerencia, marca, pack, hl).
   Misma agrupacion de marcas y packs que la seccion de brand pack total (BITACORA): Golden 6XX = 620 RB + 650 RB. */
const GBP = (function () {
  const mapM = m => /^Mikes H/i.test(m) ? "Mike's" : /^Cusque/i.test(m) ? 'Cusqueña' : /^(Corona|Coronita)/.test(m) ? 'Corona' :
    (m === 'Pilsen Fresh' || m === 'Pilsen Callao Fresh') ? 'Pilsen Fresh' : m === 'Pilsen Callao' ? 'Pilsen Callao' : /^Cristal/.test(m) ? 'Cristal' :
    m.toLowerCase() === 'golden' ? 'Golden' : m === 'San Juan' ? 'San Juan' : 'Otras marcas';
  const o = {};
  const add = (k, i, v) => { (o[k] = o[k] || Z())[i] += v; };
  RGBP.forEach(r => {
    const i = (+r[0].slice(0, 4) - 2023) * 12 + (+r[0].slice(4) - 1); if (i < 0 || i > 45) return;
    const g = r[1].replace('PE Ger P4 ', ''), br = mapM(r[2]);
    const pk = br === 'Golden' && (r[3] === '620 RB' || r[3] === '650 RB') ? '6XX' : r[3], v = +r[4];
    add(g + '|' + br + '|' + pk, i, v); add(g + '|T|' + br, i, v); add('ALL|' + br + '|' + pk, i, v); add('ALL|T|' + br, i, v);
  });
  return o;
})();
/* control de cuadre contra la seccion de brand pack total (diferencia maxima mensual en HL) */
window.__gbpChk = BPS.map(([br, ps]) => [br].concat(ps.map(p => Math.round(Math.max(...(BP[br + '|' + p] || Z()).map((x, i) => Math.abs(x - (GBP['ALL|' + br + '|' + p] || Z())[i]))))),
  Math.round(Math.max(...(BP['T|' + br] || Z()).map((x, i) => Math.abs(x - (GBP['ALL|T|' + br] || Z())[i]))))));

G.forEach(g => {
  const gt = gvTot(g);
  const gs = k => GBP[g + '|' + k];
  const has = a => a && (ytd(a, 3) >= 1 || ytd(a, 2) >= 1 || ytd(a, 1) >= 1);
  /* tabla resumen de la GV */
  (function () {
    const b = slide('GV ' + g + ' · brand pack · principales por marca', 'YTD Oct\'26 · mix = % del total de la GV');
    let t = '<table class="t" style="font-size:10px"><tr><th style="width:22%">Brand pack</th><th>YTD 26</th><th>vs 25</th><th>vs 24</th><th>vs 23</th><th>Mix 26</th><th>Δ pp vs 25 / 24 / 23</th></tr>';
    const cell = (a, y) => { const c = ytd(a, 3), p = ytd(a, y); return p < 1 ? '<td class="mut">' + (c < 1 ? '—' : 'nuevo') + '</td>' : '<td class="' + cls(c - p) + '">' + pc(c, p) + ' (' + sg(c - p) + ')</td>'; };
    const row = (n, a, bold) => { const m = [0, 1, 2, 3].map(y => ytd(gt, y) >= 1 ? ytd(a, y) / ytd(gt, y) * 100 : 0); t += '<tr' + (bold ? ' class="tt"' : '') + '><td>' + n + '</td><td>' + f(ytd(a, 3)) + '</td>' + cell(a, 2) + cell(a, 1) + cell(a, 0) + '<td>' + m[3].toFixed(1) + '%</td><td class="' + cls(m[3] - m[2]) + '">' + pp(m[3] - m[2]) + ' / ' + pp(m[3] - m[1]) + ' / ' + pp(m[3] - m[0]) + '</td></tr>'; };
    BPS.forEach(([br, ps]) => { const bt = gs('T|' + br); if (!has(bt)) return; row(br + ' (total)', bt, true); ps.forEach(p => { const a = gs(br + '|' + p); if (has(a)) row(br + ' ' + PLB(p), a, false); }); });
    row('Total GV ' + g, gt, true);
    b.innerHTML = t + '</table><div class="note">Volumen Beer+Rtds de la GV con gerencia vigente del cliente (dm_cliente). Golden 6XX = 620 RB + 650 RB (cambio de formato). Los packs de cada marca que no aparecen no tienen volumen en la GV.</div>';
    b.querySelector('table').querySelectorAll('td,th').forEach(x => { x.style.padding = '1px 4px'; });
  })();
  /* tarjetas por marca dentro de la GV */
  BPS.forEach(([br, ps]) => {
    const bt = gs('T|' + br); if (!has(bt) || ytd(bt, 3) < 50) return;
    const pk = ps.filter(p => has(gs(br + '|' + p)) && ytd(gs(br + '|' + p), 3) >= 1);
    if (!pk.length) return;
    const items = [{name: br + ' · total marca en ' + g, a: bt, base: gt, baseName: 'la GV', opt: {tot: true, mixLabel: 'Mix'}}];
    pk.forEach(p => items.push({name: br + ' ' + PLB(p), a: gs(br + '|' + p), base: bt, baseName: 'la marca', opt: br === 'Golden' && p === '6XX' ? {note: '620 RB + 650 RB (cambio de formato)'} : {}}));
    cardSlides('GV ' + g + ' · brand pack · ' + br, 'Serie continua y por año · peso = % del pack dentro de la marca en la GV', items, {series: pk.map((p, i) => ({n: PLB(p), a: gs(br + '|' + p), c: i})), base: bt, unit: 'de packs ' + br + ' en ' + g});
  });
});
