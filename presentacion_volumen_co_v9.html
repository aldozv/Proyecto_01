    const bL = isNew ? bs.map(r => '<b>' + r.n + '</b> ' + k1(r.b26) + ' k') : bs.map(r => '<b>' + r.n + '</b> ' + (r.b25 >= 1 ? pcs(r.b26, r.b25) : 'nuevo') + ' (' + sk(r.b26 - r.b25) + ' k)');
    const gl = Object.keys(GVd).map(n => Object.assign({n: n}, GVd[n])).sort((p, q) => isNew ? q.v26 - p.v26 : (q.v26 - q.v25) - (p.v26 - p.v25));
    const bg = gl[0], gT = Object.values(GVd).reduce((s, r) => s + r.v26, 0);
    const gTxt = isNew ? bg.n + ': ' + f(bg.v26) + ' HL, ' + Math.round(bg.v26 / gT * 100) + '% del volumen de la marca.' : bg.n + ': ' + pcs(bg.v26, bg.v25) + ' (' + sg(bg.v26 - bg.v25) + ' HL), la que más crece.';
    return col(k,
      '<div style="display:flex;gap:5px;height:104px">' + kpi(fm(o.y26), 'volumen YTD' + (isNew ? '' : ' · ' + pcs(o.y26, o.y25) + ' vs LY'), pcs(o.y26, bu[0]) + ' vs budget YTD (' + f(bu[0]) + ' HL)') +
        kpi(fm(o.le), 'LE 2026', pcs(o.le, bu[1]) + ' vs budget FY (' + f(bu[1]) + ' HL)') + '</div>' +
      '<div class="legend" style="font-size:11px;margin:7px 0 2px"><span><i style="background:' + CY + ';outline:1px solid #b5a800"></i>volumen (HL)</span><span><i style="background:' + CP + '"></i>Nov–Dic proy.</span><span><i class="ln" style="border-color:#111"></i>Brand Distribution</span><span><i class="ln" style="border-color:#111;border-top-style:dashed"></i>BD Nov–Dic proy.</span></div>' +
      '<div class="box" style="height:196px"><canvas id="in' + i + '"></canvas></div>' + skuTab(sk3, isNew, totV, Object.values(S)));
  };
  const ORD = ['Non Alc', 'Pilsen Fresh', 'Flying Fish'];
  bodyOf(s).innerHTML = '<div class="cols" style="grid-template-columns:repeat(3,1fr);gap:14px">' + ORD.map(card).join('') + '</div>';
  s.querySelectorAll('ul.b').forEach(u => { u.style.fontSize = '12.3px'; u.style.lineHeight = '1.32'; });
  s.querySelectorAll('.ch').forEach(h => { h.style.textAlign = 'center'; });   /* v9: títulos centrados */
  /* v9: BD Nov–Dic proyectado (usuario 15.11.26, escala x10 sobre lo dictado): Non Alc 3,100 / 3,600; Pilsen Fresh Nov = Set, Dic 13,000; Flying Fish Nov = Set, Dic 1,400 */
  const BDP = {'Non Alc': [4200, 5800], 'Pilsen Fresh': [K['Pilsen Fresh'].b[8], 12000], 'Flying Fish': [K['Flying Fish'].b[8], K['Flying Fish'].b[5]]};   /* v9 ajuste usuario: Non Alc 4.2k / 5.8k; PF Dic 12k; FF Dic = Jun */
  s.querySelectorAll('table.t th').forEach(h => { h.style.whiteSpace = 'nowrap'; h.style.fontSize = '12.5px'; h.style.padding = '5px 5px'; });
  ORD.forEach((k, i) => {

    new Chart(s.querySelector('#in' + i), {data: {labels: lab, datasets: [

        {type: 'bar', data: vv, yAxisID: 'y', backgroundColor: vv.map((v, j) => j + st >= 10 ? CP : CY), borderColor: vv.map((v, j) => j + st >= 10 ? '#6b6b6b' : '#b5a800'), borderWidth: 1, barPercentage: 0.8, categoryPercentage: 0.9, order: 1}]},

  });

/* ================= 11. CIERRE 2026 (4 filas x 3) ================= */
(function () {

    '<div class="cond" style="font-weight:800;font-size:24px;line-height:1.05;color:#fff;white-space:nowrap">' + v + '</div>' +

    '<div style="display:flex;align-items:stretch">' + half('YTD Ene–Oct', L[0], L[1], L[2], false) + half('Cierre 2026', R[0], R[1], R[2], true, m) + '</div>' +
    (nn ? '<div style="font-size:11px;color:#bdbdbd;margin-top:4px;border-top:1px solid #2c2c2c;padding-top:3px">' + nn + '</div>' : '') + '</div></div></div>';
  const nd = h => '<div class="col"><div class="ch" style="padding:3px 10px;font-size:14.5px">' + h + '</div><div class="cb" style="padding:5px"><div class="blk" style="height:100%;padding:7px 14px;display:flex;align-items:center"><span style="color:#9a9a9a;font-size:24px" class="cond">Faltan datos</span></div></div></div>';
  const RY = [0, 1, 2, 3].map(y => ytd(RTD, y)), NY = [0, 1, 2, 3].map(nY);
  const KH = v => k1(v) + ' kHL';
  const vs = (a, b, fm, u, lbl) => [fm(a), pcs(a, b) + ' ' + (lbl || 'vs LY'), (u === 'HL' ? sg(a - b) : sk(a - b)) + ' ' + u + ' ' + (lbl || 'vs LY')];
  const nnS = (a, b, nn) => '<b style="color:#fff">NN ' + sp(nn) + '</b> · CO ' + ppx(gp(a, b) - nn) + ' al YTD';
  const nnV = (a, nn, fm) => 'YTD CO = <b style="color:#fff">' + pct(a, nn) + ' del NN</b> (' + fm(nn) + ')';
  const mb = (a, m, fm) => pct(a, m) + ' vs meta (' + fm(m) + ')';
  /* v8: Share, PTC y Coolers (tabla del usuario 15.11.26; Share y PTC = Nielsen, Coolers = data interna) */
  const SPC = {sh: [99.21, 98.87, 98.80, 98.90], ptc: [6.91, 6.62, 6.94, 6.66], co: [63.20, 62.67, 68.50, 64.25], gmv: [104.8, 82.1, 105.5, 82.0]};   /* v9: GMV reemplaza a Coolers (usuario 15.11.26) */
  const src = t => '<span style="color:#7a7a7a;font-weight:400">Fuente: ' + t + '</span>';
  const pp = (a, b, d) => [a.toFixed(d || 1) + '%', (a >= b ? '+' : '−') + Math.abs(a - b).toFixed(d || 1) + ' pp vs LY', 'LY ' + b.toFixed(d || 1) + '%'];
  const so = (a, b) => ['S/ ' + a.toFixed(2), pcs(a, b) + ' vs LY', (a >= b ? '+' : '−') + 'S/ ' + Math.abs(a - b).toFixed(2) + ' vs LY'];

    tile2('Volumen Flying Fish', vs(ffY, BUD['Flying Fish'][0], v => f(v) + ' HL', 'HL', 'vs BGT'), [f(ffLE) + ' HL', 'nuevo vs LY', '+' + f(ffLE) + ' HL vs LY'], mb(ffLE, BUD['Flying Fish'][1], v => f(v) + ' HL'), nnV(ffY, NN.ff, v => k1(v) + ' kHL')) +
    tile2('Brand Distribution', vs(BD10[3], BD10[2], v => k1(v) + ' k SKUs', 'k'), vs(bd26, bd25, v => k1(v) + ' k SKUs', 'k'), mb(bd26, BDM, v => k1(v) + ' k'), nnS(BD10[3], BD10[2], NN.bd)) +
    tile2('Share (cerveza)', pp(SPC.sh[0], SPC.sh[1], 2), pp(SPC.sh[2], SPC.sh[3], 2), ' ') + tile2('PTC (S/ por unidad)', so(SPC.ptc[0], SPC.ptc[1]), so(SPC.ptc[2], SPC.ptc[3]), ' ') + tile2('GMV', pp(SPC.gmv[0], SPC.gmv[1]), pp(SPC.gmv[2], SPC.gmv[3]), ' ') + '</div>';
  s.querySelector('.cols').style.gridTemplateRows = '1fr 1fr 1fr 0.88fr';
  s.querySelector('.cols').style.height = '588px'; s.querySelector('.cols').style.rowGap = '6px';

if (/solo=compradores/.test(location.search)) [...deck.children].forEach(n => { if (n.dataset.tag !== "compradores") n.remove(); });
/* v7: numeración (portada y separadores sin número) */
