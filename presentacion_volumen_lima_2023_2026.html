cardSlides('Canales · Total Dirección', 'Serie continua y por año · peso = % del canal en la dirección', [{name: 'Total Dirección', a: RT, opt: {tot: true}}].concat(CH.map(c => ({name: CHN[c], a: chTot(c), base: RT, baseName: 'la dirección'}))), {series: CH.map((c, i) => ({n: CHN[c], a: chTot(c), c: i})), base: RT, unit: 'de canales'});

/* ---------- 7. Matrices gerencia x canal ---------- */
threeMatrices('Gerencia x canal', 'Beer+Rtds', CH, 'Canal', (g, r) => {
  if (g === 'Total') return r === '__T' ? RT : chTot(r);
  return r === '__T' ? gvTot(g) : (GC[g + '|' + r] || null);
});

/* ---------- 8. Gerencia x canal por GV ---------- */
G.forEach(g => {
  const t = gvTot(g);
  const items = [{name: 'Total GV ' + g, a: t, base: RT, baseName: 'la dirección', opt: {tot: true}}];
  CH.forEach(c => { const a = GC[g + '|' + c]; if (a && (ytd(a, 3) >= 500 || ytd(a, 2) >= 500)) items.push({name: CHN[c], a, base: t, baseName: 'la GV'}); });
  if (items.length === 2) { items[0].opt = Object.assign({}, items[0].opt, {note: '100% del volumen de la GV va por ' + items[1].name}); cardSlides('GV ' + g + ' · por canal (canal único: ' + items[1].name + ')', 'Serie continua y por año', [items[0]]); return; }
  cardSlides('GV ' + g + ' · por canal', 'Serie continua y por año · peso = % del canal en la GV', items, {series: CH.map((c, i) => ({n: CHN[c], a: ser(GC, g + '|' + c), c: i})), base: t, unit: 'de canales'});
});

/* ---------- Marcas y brand packs · Total Dirección ---------- */
/* ---------- 10. Marca regional y por GV ---------- */
cardSlides('Marcas · Total Dirección', 'Serie continua y por año · mix = % de la marca en la dirección', [{name: 'Total Dirección', a: RT, opt: {tot: true}}].concat(BR.map(b => ({name: b, a: ser(BRM, b), base: RT, baseName: 'la dirección', opt: {mixLabel: 'Mix'}}))), {series: BR.map(b => ({n: b, a: ser(BRM, b), c: b in BRC ? BRC[b] : -1})), base: RT, unit: 'de marcas'});

/* ---------- 11. Mix de marcas ---------- */
(function () {
  const b = slide('Mix de marcas · Total Dirección', '% del volumen Beer+Rtds · suma 100%');
  const M = [['Pilsen Callao', '#2a78d6'], ['Cusqueña', '#eb6834'], ['Cristal', '#1baf7a'], ["Mike's", '#eda100'], ['Corona', '#e87ba4'], ['Golden', '#6250d6']];
  const others = a => a;
  const S = M.map(m => ser(BRM, m[0]));
  const O = RT.map((x, i) => x - S.reduce((s, a) => s + a[i], 0));
  const all = M.concat([['Otros', '#b4b2a9']]); const SS = S.concat([O]);
  b.innerHTML = '<div class="legend">' + all.map(m => '<span><b style="background:' + m[1] + '"></b>' + m[0] + '</span>').join('') + '<span class="mut">Otros = Kauffmann, Budweiser, Stella Artois, Flying Fish y resto</span></div><div class="two"><div><div class="sec">YTD Ene–Oct de cada año</div><div class="box" style="height:300px"><canvas></canvas></div></div><div><div class="sec">Años cerrados (FY) 2023–2025 y YTD 2026</div><div class="box" style="height:300px"><canvas></canvas></div></div></div><div class="tm"></div>';
  const lbl = {id: 'lbl', afterDatasetsDraw(ch) { const ctx = ch.ctx; ctx.save(); ctx.font = '600 11px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ch.data.datasets.forEach((d, di) => { ch.getDatasetMeta(di).data.forEach((bb, i) => { const v = d.data[i]; if (v < 3.5) return; ctx.fillStyle = di === 6 ? '#2c2c2a' : '#ffffff'; ctx.fillText(v.toFixed(1) + '%', bb.x, (bb.y + bb.base) / 2); }); }); ctx.restore(); }};
  const mk = (cv, fn, labels) => new Chart(cv, {type: 'bar', data: {labels, datasets: all.map((m, k) => ({label: m[0], data: [0, 1, 2, 3].map(y => fn(SS[k], y) / fn(RT, y) * 100), backgroundColor: m[1], borderColor: '#fff', borderWidth: {top: 1}, borderSkipped: false, barThickness: 70}))}, options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {stacked: true, grid: {display: false}, ticks: {font: {size: 11}}}, y: {stacked: true, min: 0, max: 100, grid: {color: GRID}, ticks: {callback: v => v + '%'}}}}, plugins: [lbl]});
  const cv = b.querySelectorAll('canvas');
  mk(cv[0], ytd, ['YTD 23', 'YTD 24', 'YTD 25', 'YTD 26']);
  mk(cv[1], fy, ['FY 23', 'FY 24', 'FY 25', 'YTD 26']);
  let t = '<table class="t" style="margin-top:10px"><tr><th>Mix YTD (%)</th><th>2023</th><th>2024</th><th>2025</th><th>2026</th><th>pp vs 25</th><th>pp vs 24</th><th>pp vs 23</th></tr>';
  all.forEach((m, k) => { const v = [0, 1, 2, 3].map(y => ytd(SS[k], y) / ytd(RT, y) * 100); t += '<tr><td>' + m[0] + '</td>' + v.map(x => '<td>' + x.toFixed(1) + '</td>').join('') + [2, 1, 0].map(y => '<td class="' + cls(v[3] - v[y]) + '">' + pp(v[3] - v[y]) + '</td>').join('') + '</tr>'; });
  t += '<tr class="tt"><td>Total</td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td><td></td><td></td><td></td></tr>';
  b.querySelector('.tm').innerHTML = t + '</table>';
})();

/* ---------- 12. Brand pack tabla ---------- */
(function () {
  const b = slide('Brand pack · principales por marca · Total Dirección', 'YTD Oct\'26 · mix = % del total de la dirección');
  let t = '<table class="t" style="font-size:10px"><tr><th style="width:22%">Brand pack</th><th>YTD 26</th><th>vs 25</th><th>vs 24</th><th>vs 23</th><th>Mix 26</th><th>Δ pp vs 25 / 24 / 23</th></tr>';
  const cell = (a, y) => { const c = ytd(a, 3), p = ytd(a, y); return p < 1 ? '<td class="mut">nuevo</td>' : '<td class="' + cls(c - p) + '">' + pc(c, p) + ' (' + sg(c - p) + ')</td>'; };
  const row = (n, a, bold) => { const m = [0, 1, 2, 3].map(y => ytd(a, y) / ytd(RT, y) * 100); t += '<tr' + (bold ? ' class="tt"' : '') + '><td>' + n + '</td><td>' + f(ytd(a, 3)) + '</td>' + cell(a, 2) + cell(a, 1) + cell(a, 0) + '<td>' + m[3].toFixed(1) + '%</td><td class="' + cls(m[3] - m[2]) + '">' + pp(m[3] - m[2]) + ' / ' + pp(m[3] - m[1]) + ' / ' + pp(m[3] - m[0]) + '</td></tr>'; };
  BPS.forEach(([br, ps]) => { row(br + ' (total)', BP['T|' + br], true); ps.forEach(p => row(br + ' ' + PLB(p), BP[br + '|' + p], false)); });
  b.innerHTML = t + '</table><div class="note">Marca y brand pack según el maestro de portafolio (pe_portfolio_material). Golden 620 RB y 355 CAN y Budweiser 343 NRB ya no se venden (quedan en el total de su marca). Golden 650 RB reemplaza al 620 RB desde 2025.</div>';
  b.querySelector('table').querySelectorAll('td,th').forEach(x => { x.style.padding = "1px 4px"; });
})();

/* ---------- 13. Brand pack cards ---------- */
(function () {
  BPS.forEach(([br, ps]) => {
    const t = BP['T|' + br];
    const items = [{name: br + ' · total marca', a: t, base: RT, baseName: 'la dirección', opt: {tot: true, mixLabel: 'Mix'}}];
    ps.forEach(p => items.push({name: br + ' ' + PLB(p), a: BP[br + '|' + p], base: t, baseName: 'la marca', opt: br === 'Golden' && p === '650 RB' ? {note: 'Reemplaza al 620 RB desde 2025 (cambio de formato)'} : {}}));
    cardSlides('Brand pack · ' + br, 'Serie continua y por año · peso = % del pack dentro de su marca', items, {series: ps.map((p, i) => ({n: PLB(p), a: BP[br + '|' + p], c: i})), base: t, unit: 'de packs ' + br});
  });
})();


/* ---------- Gerencia x marca y top 5 brand pack por gerencia ---------- */
const BRX = BR.concat(['Otras marcas']);
const top5 = g => Object.keys(GBP).filter(k => k.startsWith(g + '|')).sort((p, q) => ytd(GBP[q], 3) - ytd(GBP[p], 3)).slice(0, 5);
const bpLbl = k => { const p = k.split('|'); return p[1] + ' ' + p[2]; };
const dirBP = l => { const k = Object.keys(BP).find(x => !x.startsWith('T|') && x.replace('|', ' ') === l); return k ? BP[k] : null; };

/* Insight 2d: marcas y brand packs por gerencia */
(function () {
  const b = slide('Insight 2d · Marcas y brand packs por gerencia: el 630 y la lata 473 empujan', 'YTD Ene–Oct 2026 vs 2025 · top 5 = mayor volumen en la GV');
  let t = '<table class="t" style="font-size:11.5px"><tr><th style="width:15%">Gerencia</th><th>YTD 26</th><th>Top 5 % de la GV</th><th>PC 630 RB % de la GV</th><th style="width:24%">Brand pack que más suma</th><th style="width:24%">Brand pack que más resta</th></tr>';
  let s26 = 0, s5 = 0, s630 = 0;
  G.forEach(g => {
    const tot = ytd(gvTot(g), 3); const tk = top5(g); const t5 = tk.reduce((s, k) => s + ytd(GBP[k], 3), 0);
    const pc6 = GBP[g + '|Pilsen Callao|630 RB'] ? ytd(GBP[g + '|Pilsen Callao|630 RB'], 3) : 0;
    const ds = Object.keys(GBP).filter(k => k.startsWith(g + '|')).map(k => ({n: bpLbl(k), d: ytd(GBP[k], 3) - ytd(GBP[k], 2)})).sort((p, q) => q.d - p.d);
    const up = ds[0], dn = ds[ds.length - 1];
    s26 += tot; s5 += t5; s630 += pc6;
    t += '<tr><td>' + g + '</td><td>' + f(tot) + '</td><td>' + (t5 / tot * 100).toFixed(1) + '%</td><td>' + (pc6 / tot * 100).toFixed(1) + '%</td><td class="up">' + up.n + '<small>' + sg(up.d) + '</small></td><td class="' + cls(dn.d) + '">' + dn.n + '<small>' + sg(dn.d) + '</small></td></tr>';
  });
  t += '<tr class="tt"><td>Total</td><td>' + f(s26) + '</td><td>' + (s5 / s26 * 100).toFixed(1) + '%</td><td>' + (s630 / s26 * 100).toFixed(1) + '%</td><td></td><td></td></tr></table>';
  b.innerHTML = '<div class="two ins"><div>' + t + '<div class="note">Top 5 % de la GV = volumen de sus 5 brand packs principales sobre el total de la GV. Brand pack que más suma o resta = Δ HL vs YTD 25 dentro de la GV.</div></div><div><ul class="hlx">' +
    '<li><b>Pilsen Callao 630 RB lidera en 6 de 7 gerencias</b> y crece en las 6; en Lima Centro (+50,063, +30.9%) y Lima Norte (+44,475, +22.1%) es la mayor fuente de crecimiento. En Mayoristas y Eventos está plano (+0.4%).</li>' +
    '<li><b>La lata 473 de Pilsen Callao está en el top 5 de las 7 gerencias</b> y crece entre +13% y +55%; en Lima Este también suma Pilsen Callao 355 CAN (+17,566, +84.6%).</li>' +
    '<li class="dn"><b>Los formatos grandes que no son el 630 caen:</b> Pilsen Callao 1000 RB baja en las 5 territoriales (Lima Oeste −16.1%, Lima Norte −15.4%) y Cusqueña 620 RB cae en todas las gerencias donde está en el top 5.</li>' +
    '<li class="dn"><b>Lima Norte es la plaza de Cristal</b> (118 mil HL, 36% de Cristal en Lima): Cristal 650 RB es su segundo brand pack y cae −6.4% (−6,623 HL).</li>' +
    '<li><b>Mayoristas y Eventos crece por Mike\'s 355 CAN</b> (+23,705, +112.7%), más que por Pilsen Callao. <b>Central KA</b> es la única GV donde el 630 RB no está en el top 5: la encabezan latas (PC 355 CAN, Kauffmann, Cusqueña 310 NRB).</li>' +
    '<li><b>Concentración:</b> el top 5 pesa 71–86% del volumen de cada GV; Mayoristas y Eventos es la más concentrada (86%, con el 630 RB en 52%).</li>' +
    '</ul></div></div>';
})();

/* Gerencia x marca: matriz y tarjetas por GV */
threeMatrices('Gerencia x marca', 'Beer+Rtds', BRX, 'Marca', (g, r) => {
  if (g === 'Total') return r === '__T' ? RT : ser(BRM, r);
  return r === '__T' ? gvTot(g) : (GM[g + '|' + r] || null);
});
G.forEach(g => {
  const t = gvTot(g);
  const items = [{name: 'Total GV ' + g, a: t, base: RT, baseName: 'la dirección', opt: {tot: true}}];
  BR.forEach(br => { const a = GM[g + '|' + br]; if (a && (ytd(a, 3) >= 500 || ytd(a, 2) >= 500)) items.push({name: br, a, base: t, baseName: 'la GV', opt: {mixLabel: 'Mix'}}); });
  cardSlides('GV ' + g + ' · por marca', 'Serie continua y por año · mix = % de la marca en la GV', items, {series: BRX.map(br => ({n: br, a: ser(GM, g + '|' + br), c: br in BRC ? BRC[br] : -1})), base: t, unit: 'de marcas'});
});

/* Gerencia x brand pack: matriz del top 5 de cada GV y tarjetas */
(function () {
  const keys = [];
  G.forEach(g => top5(g).forEach(k => { const l = bpLbl(k); if (!keys.includes(l)) keys.push(l); }));
  keys.sort((p, q) => ytd(dirBP(q) || Z(), 3) - ytd(dirBP(p) || Z(), 3));
  threeMatrices('Gerencia x brand pack (top 5 de cada GV)', 'Beer+Rtds', keys, 'Brand pack', (g, r) => {
    if (g === 'Total') return r === '__T' ? RT : dirBP(r);
    if (r === '__T') return gvTot(g);
    const k = Object.keys(GBP).find(x => x.startsWith(g + '|') && bpLbl(x) === r);
    return k ? GBP[k] : null;
  });
})();
G.forEach(g => {
  const t = gvTot(g), tk = top5(g);
  const items = [{name: 'Total GV ' + g, a: t, base: RT, baseName: 'la dirección', opt: {tot: true}}].concat(tk.map(k => ({name: bpLbl(k), a: GBP[k], base: t, baseName: 'la GV'})));
  cardSlides('GV ' + g + ' · top 5 brand pack', 'Serie continua y por año · peso = % del brand pack en la GV', items, {series: tk.map((k, i) => ({n: bpLbl(k), a: GBP[k], c: i})), base: t, unit: 'del top 5 brand pack'});
});

window.__READY = true;
document.title = 'Volumen Beer+Rtds Lima';
</script>
</body>
