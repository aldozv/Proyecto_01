function catSlide(title, a, color, fillC, bul) {
  const b = slide(title, 'Comparación mensual por año y serie continua Ene\'23 – Oct\'26, HL');
  const kp = '<div style="font-size:12.5px;margin-bottom:4px">YTD Oct\'26: <b>' + f(ytd(a, 3)) + ' HL</b> · ' + [2, 1, 0].map(y => '<span class="' + cls(ytd(a, 3) - ytd(a, y)) + '">' + pc(ytd(a, 3), ytd(a, y)) + ' (' + sg(ytd(a, 3) - ytd(a, y)) + ') vs ' + (2023 + y) + '</span>').join(' · ') + '</div>';
  b.innerHTML = yearLegend + kp + '<div class="two"><div><div class="sec" style="margin-top:0">Por año (Ene–Dic)</div><div class="box" style="height:370px"><canvas></canvas></div></div><div><div class="sec" style="margin-top:0">Serie continua Ene\'23 – Oct\'26</div><div class="box" style="height:370px"><canvas></canvas></div></div></div><ul class="bul" style="margin-top:8px;font-size:13px">' + bul.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  const cv = b.querySelectorAll('canvas');
  lineYears(cv[0], a, true);
  new Chart(cv[1], {type: 'line', data: {labels: L46, datasets: [{data: a, borderColor: color, backgroundColor: fillC, fill: true, borderWidth: 2.5, pointRadius: 2, pointBackgroundColor: color, tension: .2}]},
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {grid: {display: false}, ticks: {autoSkip: false, maxRotation: 60, minRotation: 60, font: {size: 9}}}, y: {min: 0, grid: {color: GRID}, ticks: {callback: v => f(v)}}}}});
}
catSlide('Beer (Cervezas + Licores) · por año y serie continua', BEER, '#2a78d6', 'rgba(42,120,214,0.10)', [
  '<b>Estacionalidad marcada y estable:</b> piso en Mar–Abr (178–203 mil HL) y pico en Dic (récord 301,201 HL en Dic\'25); el nivel sube de forma gradual cada año (~+2% anual: +46,924 / +48,113 / +46,065 HL), sin escalones como RTD.',
  'Solo 5 de 10 meses superan LY (caen Abr, May, Jun, Ago y Set); Oct\'26 (253,952 HL, +23,825 vs LY) es el mejor octubre de la serie.']);
catSlide('RTD · por año y serie continua', RTD, '#1baf7a', 'rgba(27,175,122,0.12)', [
  '<b>Ene\'23–Dic\'24 plano</b> (330–980 HL/mes) · <b>Ene\'25–Set\'25 primer escalón</b> (800–1,700 HL) · <b>desde Oct\'25 aceleración</b> hasta 6,078 HL en Oct\'26 (2.6x Oct\'25).',
  'RTD 2026 crece todos los meses sin la estacionalidad de Beer → señal de más clientes/SKUs, no solo temporada. Los cambios de nivel (Ene\'25 y Oct\'25) conviene cruzarlos con lanzamientos de SKUs/sabores Mike\'s y cobertura.']);

/* ---------- 14. Performance volumen por gerencia ---------- */
cardSlides('Performance volumen Beer+Rtds · por gerencia de ventas', 'Serie continua y por año · peso = % de la GV en la regional', [{name: 'Total Dirección', a: RT, opt: {tot: true}}].concat(G.map(g => ({name: 'GV ' + g, a: gvTot(g), base: RT, baseName: 'la regional'}))), {series: G.map((g, i) => ({n: 'GV ' + g, a: gvTot(g), c: i})), base: RT, unit: 'de gerencias'});
/* ---------- 6. Canales regional ---------- */
const chTot = c => sumS(G.map(g => ser(GC, g + '|' + c)));
cardSlides('Canales · Total Dirección', 'Serie continua y por año · peso = % del canal en la regional', [{name: 'Total Dirección', a: RT, opt: {tot: true}}].concat(CH.map(c => ({name: CHN[c], a: chTot(c), base: RT, baseName: 'la regional'}))), {series: CH.map((c, i) => ({n: CHN[c], a: chTot(c), c: i})), base: RT, unit: 'de canales'});

/* ---------- 7. Matrices gerencia x canal ---------- */
threeMatrices('Gerencia x canal', 'Beer+Rtds', CH, 'Canal', (g, r) => {
  if (g === 'Total') return r === '__T' ? RT : chTot(r);
  return r === '__T' ? gvTot(g) : (GC[g + '|' + r] || null);
});

/* ---------- 8. Gerencia x canal por GV ---------- */
G.forEach(g => {
  const t = gvTot(g);
  const items = [{name: 'Total GV ' + g, a: t, base: RT, baseName: 'la regional', opt: {tot: true}}];
  CH.forEach(c => { const a = GC[g + '|' + c]; if (a && (ytd(a, 3) >= 1 || ytd(a, 2) >= 1)) items.push({name: CHN[c], a, base: t, baseName: 'la GV'}); });
  if (items.length === 2) { items[0].opt = Object.assign({}, items[0].opt, {note: '100% del volumen de la GV va por ' + items[1].name}); cardSlides('GV ' + g + ' · por canal (canal único: ' + items[1].name + ')', 'Serie continua y por año', [items[0]]); return; }
  cardSlides('GV ' + g + ' · por canal', 'Serie continua y por año · peso = % del canal en la GV', items, {series: CH.map((c, i) => ({n: CHN[c], a: ser(GC, g + '|' + c), c: i})), base: t, unit: 'de canales'});
});

/* ---------- 9. Matrices gerencia x marca ---------- */
const gmTot = b => sumS(G.map(g => ser(GM, g + '|' + b)));
threeMatrices('Gerencia x marca', 'Beer+Rtds', BR, 'Marca', (g, r) => {
  if (g === 'Total') return r === '__T' ? RT : gmTot(r);
  return r === '__T' ? gvTot(g) : (GM[g + '|' + r] || null);
});

/* ---------- 10. Marca regional y por GV ---------- */
cardSlides('Marcas · Total Dirección', 'Serie continua y por año · mix = % de la marca en la regional', [{name: 'Total Dirección', a: RT, opt: {tot: true}}].concat(BR.map(b => ({name: b, a: gmTot(b), base: RT, baseName: 'la regional', opt: {mixLabel: 'Mix'}}))), {series: BR.map(b => ({n: b, a: gmTot(b), c: b in BRC ? BRC[b] : -1})), base: RT, unit: 'de marcas'});
G.forEach(g => {
  const t = gvTot(g);
  const items = [{name: 'Total GV ' + g, a: t, base: RT, baseName: 'la regional', opt: {tot: true}}];
  BR.forEach(b => { const a = GM[g + '|' + b]; if (a && (ytd(a, 3) >= 1 || ytd(a, 2) >= 1)) items.push({name: b, a, base: t, baseName: 'la GV', opt: {mixLabel: 'Mix'}}); });
  cardSlides('GV ' + g + ' · por marca', 'Serie continua y por año · mix = % de la marca en la GV', items, {series: BR.map(b => ({n: b, a: ser(GM, g + '|' + b), c: b in BRC ? BRC[b] : -1})), base: t, unit: 'de marcas'});
});

/* ---------- 11. Mix de marcas ---------- */
(function () {
  const b = slide('Mix de marcas · Total Dirección', '% del volumen Beer+Rtds · suma 100%');
  const M = [['Pilsen Callao', '#2a78d6'], ['Cristal', '#eb6834'], ['San Juan', '#1baf7a'], ['Cusqueña', '#eda100'], ["Mike's", '#e87ba4'], ['Golden', '#6250d6']];
  const others = a => a;
  const S = M.map(m => gmTot(m[0]));
  const O = RT.map((x, i) => x - S.reduce((s, a) => s + a[i], 0));
  const all = M.concat([['Otros', '#b4b2a9']]); const SS = S.concat([O]);
  b.innerHTML = '<div class="legend">' + all.map(m => '<span><b style="background:' + m[1] + '"></b>' + m[0] + '</span>').join('') + '<span class="mut">Otros = Corona, Pilsen Fresh, Stella, Budweiser y resto</span></div><div class="two"><div><div class="sec">YTD Ene–Oct de cada año</div><div class="box" style="height:300px"><canvas></canvas></div></div><div><div class="sec">Años cerrados (FY) 2023–2025 y YTD 2026</div><div class="box" style="height:300px"><canvas></canvas></div></div></div><div class="tm"></div>';
  const lbl = {id: 'lbl', afterDatasetsDraw(ch) { const ctx = ch.ctx; ctx.save(); ctx.font = '600 11px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ch.data.datasets.forEach((d, di) => { ch.getDatasetMeta(di).data.forEach((bb, i) => { const v = d.data[i]; if (v < 3.5) return; ctx.fillStyle = di === 6 ? '#2c2c2a' : '#ffffff'; ctx.fillText(v.toFixed(1) + '%', bb.x, (bb.y + bb.base) / 2); }); }); ctx.restore(); }};
  const mk = (cv, fn, labels) => new Chart(cv, {type: 'bar', data: {labels, datasets: all.map((m, k) => ({label: m[0], data: [0, 1, 2, 3].map(y => fn(SS[k], y) / fn(RT, y) * 100), backgroundColor: m[1], borderColor: '#fff', borderWidth: {top: 1}, borderSkipped: false, barThickness: 70}))}, options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {stacked: true, grid: {display: false}, ticks: {font: {size: 11}}}, y: {stacked: true, min: 0, max: 100, grid: {color: GRID}, ticks: {callback: v => v + '%'}}}}, plugins: [lbl]});
  const cv = b.querySelectorAll('canvas');
  mk(cv[0], ytd, ['YTD 23', 'YTD 24', 'YTD 25', 'YTD 26']);
  mk(cv[1], fy, ['FY 23', 'FY 24', 'FY 25', 'YTD 26']);
  let t = '<table class="t" style="margin-top:10px"><tr><th>Mix YTD (%)</th><th>2023</th><th>2024</th><th>2025</th><th>2026</th><th>pp vs 25</th><th>pp vs 24</th><th>pp vs 23</th></tr>';
  all.forEach((m, k) => { const v = [0, 1, 2, 3].map(y => ytd(SS[k], y) / ytd(RT, y) * 100); t += '<tr><td>' + m[0] + '</td>' + v.map(x => '<td>' + x.toFixed(1) + '</td>').join('') + [2, 1, 0].map(y => '<td class="' + cls(v[3] - v[y]) + '">' + pp(v[3] - v[y]) + '</td>').join('') + '</tr>'; });
  t += '<tr class="tt"><td>Total</td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td><td></td><td></td><td></td></tr>';
  b.querySelector('.tm').innerHTML = t + '</table>';
})();

/* ---------- 12. Brand pack tabla ---------- */
(function () {
  const b = slide('Brand pack · principales por marca · Total Dirección', 'YTD Oct\'26 · mix = % del total regional');
  let t = '<table class="t" style="font-size:10px"><tr><th style="width:22%">Brand pack</th><th>YTD 26</th><th>vs 25</th><th>vs 24</th><th>vs 23</th><th>Mix 26</th><th>Δ pp vs 25 / 24 / 23</th></tr>';
  const cell = (a, y) => { const c = ytd(a, 3), p = ytd(a, y); return p < 1 ? '<td class="mut">nuevo</td>' : '<td class="' + cls(c - p) + '">' + pc(c, p) + ' (' + sg(c - p) + ')</td>'; };
  const row = (n, a, bold) => { const m = [0, 1, 2, 3].map(y => ytd(a, y) / ytd(RT, y) * 100); t += '<tr' + (bold ? ' class="tt"' : '') + '><td>' + n + '</td><td>' + f(ytd(a, 3)) + '</td>' + cell(a, 2) + cell(a, 1) + cell(a, 0) + '<td>' + m[3].toFixed(1) + '%</td><td class="' + cls(m[3] - m[2]) + '">' + pp(m[3] - m[2]) + ' / ' + pp(m[3] - m[1]) + ' / ' + pp(m[3] - m[0]) + '</td></tr>'; };
  BPS.forEach(([br, ps]) => { row(br + ' (total)', BP['T|' + br], true); ps.forEach(p => row(br + ' ' + PLB(p), BP[br + '|' + p], false)); });
  b.innerHTML = t + '</table><div class="note">Golden 6XX = 620 RB (hasta Jul\'25) + 650 RB (desde Abr\'25), cambio de formato comparado junto. Pilsen Callao usa 630 RB (no 620). Cusqueña 305 RB x24 = material «310ML RT 24X1» en el maestro.</div>';
  b.querySelector('table').querySelectorAll('td,th').forEach(x => { x.style.padding = "1px 4px"; });
})();

/* ---------- 13. Brand pack cards ---------- */
(function () {
  BPS.forEach(([br, ps]) => {
    const t = BP['T|' + br];
    const items = [{name: br + ' · total marca', a: t, base: RT, baseName: 'la regional', opt: {tot: true, mixLabel: 'Mix'}}];
    ps.forEach(p => items.push({name: br + ' ' + PLB(p), a: BP[br + '|' + p], base: t, baseName: 'la marca', opt: br === 'Golden' && p === '6XX' ? {note: '620 RB + 650 RB (cambio de formato)'} : {}}));
    cardSlides('Brand pack · ' + br, 'Serie continua y por año · peso = % del pack dentro de su marca', items, {series: ps.map((p, i) => ({n: PLB(p), a: BP[br + '|' + p], c: i})), base: t, unit: 'de packs ' + br});
  });
})();

window.__READY = true;
document.title = 'Volumen Beer+Rtds Centro Oriente';
</script>
