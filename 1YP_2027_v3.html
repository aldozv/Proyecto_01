const sgp = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%';
const shr = (v, tot) => Math.round(v / tot * 100) + '%';
const pend = t => '<span class="ph">' + (t || 'faltan datos') + '</span>';

/* barras horizontales de aporte: Δ kHL · % del crecimiento total */
/* etiqueta: "+46.0 kHL vs LY · +52% del crec." (long) o "+46.0 kHL · +52%" (corta, con leyenda) */
const shrS = (v, tot) => { const p = Math.round(v / tot * 100); return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + '%'; };
const cLeg = (unit, tot, long) => '<div class="legend" style="font-size:11.5px;margin-bottom:2px"><span><i style="background:#111"></i>suma</span><span><i style="background:#c62828"></i>resta</span><span style="color:#555">' +
  (long ? 'Δ ' + unit + ' vs LY · % del crecimiento total (' + sk(tot) + ' ' + unit + ')' : 'Δ ' + unit + ' vs LY · % del crecimiento total (' + sk(tot) + ')') + '</span></div>';
function contribChart(cv, labels, dd, tot, unit, long) {
  const u = unit || 'kHL', FONT = '700 11.5px Barlow, Arial';
  const mx = Math.max(0, ...dd), mn = Math.min(0, ...dd), rg = (mx - mn) || 1;
  /* espacio para etiquetas: se mide el texto y se reserva a cada lado lo necesario para que no se corte */
  const mc = document.createElement('canvas').getContext('2d');
  const W = (cv.parentNode.clientWidth || 380);
  mc.font = '600 12px Barlow, Arial'; const yW = Math.max(...labels.map(l => mc.measureText(l).width)) * 1.12 + 24;
  const A = W - yW - 14;
  mc.font = FONT;
  const mk = lg => v => sk(v) + ' ' + u + (lg ? ' vs LY · ' + shrS(v, tot) + ' del crec.' : ' · ' + shrS(v, tot));
  const need = fmt => { const p = dd.filter(v => v >= 0).map(v => mc.measureText(fmt(v)).width * 1.12 + 16), n = dd.filter(v => v < 0).map(v => mc.measureText(fmt(v)).width * 1.12 + 16); return [p.length ? Math.max(...p) : 0, n.length ? Math.max(...n) : 0]; };
  let fmt = mk(long), [Lp, Ln] = need(fmt);
  if ((Lp + Ln) / A > 0.62) { fmt = mk(false); [Lp, Ln] = need(fmt); }
  const span = rg / Math.max(0.25, 1 - (Lp + Ln) / A), ppu = A / span;
  const xmax = mx + Lp / ppu, xmin = mn - (mn < 0 ? Ln / ppu : 0);
  new Chart(cv, {type: 'bar', data: {labels: labels, datasets: [{data: dd, backgroundColor: dd.map(v => v >= 0 ? '#111' : '#c62828'), barPercentage: 0.72, categoryPercentage: 0.9}]},
    options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false, layout: {padding: {left: 2, right: 6}}, plugins: {legend: {display: false}, tooltip: {enabled: false}},
      scales: {x: {display: false, min: xmin, max: xmax}, y: {grid: {display: false}, border: {display: false}, ticks: {font: {size: 12, weight: 600}, color: '#111'}}}},
    plugins: [VALPLUG(v => fmt(v), v => v >= 0 ? '#0f7b3e' : '#c62828', FONT)]});
}

   y por pedido del usuario: decisions required, escenarios conservador y base, gracias. */
(function () {
  const lb = n => ((n.querySelector('.lbl') || {}).textContent || '');
  const h1 = n => ((n.querySelector('h1') || {}).textContent || '');
  const all = [...deck.children];
  const dropIf = n => lb(n) === '1YP 2027 | Decisions required' ||
    (lb(n) === '1YP 2027 | 5 Year Ambition' && /^5 Year Ambition:/.test(h1(n))) ||
    (lb(n) === '1YP 2027 | Strategic choices' && /3 bases/.test(h1(n))) ||
    (n.classList.contains('divi') && /Gracias/.test(n.textContent));
  all.forEach(n => { if (dropIf(n)) n.remove(); });
  const rest = [...deck.children];
  const cover = rest[0];
  const v3 = k => rest.filter(n => n.dataset.v3 === k);
  const by = t => rest.filter(n => lb(n) === t);
  const ax = rest.filter(n => n.classList.contains('divi') && /Anexo/.test(n.textContent));
  const scd = rest.filter(n => /^1YP 2027 \| Strategic choice \d/.test(lb(n)));
  /* v3 (15.11.26, pedido del usuario): separadores "Strategy insights" (inicio del anexo) y "Strategy sales" (antes de los strategic choices 1.1–3.1) */
  const sep = t => { const s = document.createElement('div'); s.className = 'slide cover divi'; s.innerHTML = stripesDiv() + '<h2 style="top:280px">' + t + '</h2>'; return s; };
  const sIns = sep('Strategy<br>insights'), sSal = sep('Strategy<br>sales');
  const main = [cover, ...by('Agenda'), ...by('1YP 2027 | ¿Qué buscamos?'), ...by('1YP 2027 | 5 Year Ambition'), ...by('1YP 2027 | Proyección 5 años'),
    ...by('1YP 2027 | FODA 2026'), ...v3('3'), ...by('1YP 2027 | Strategic choices'), ...by('1YP 2027 | Strategic initiatives'),
    ...by('1YP 2027 | Value creation 2027'), ...by('1YP 2027 | Strategic scorecard'), ...ax, sIns, ...v3('1'), ...v3('2'), ...v3('2v'), ...v3('2b'), sSal, ...scd];
  const others = rest.filter(n => !main.includes(n));
  [...main, ...others].forEach(n => deck.appendChild(n));
})();
if (/solo=compradores/.test(location.search)) [...deck.children].forEach(n => { if (n.dataset.tag !== "compradores") n.remove(); });
