/* ================= helper: barras horizontales var% + tabla ================= */
function perfSlide(sec, title, sub, rows, totA, nameHdr, msg, extraCols) { const bar = null;
  const s = slide(sec, title, sub);
  const data = rows.map(r => ({n: r.n, a: r.a, y26: ytd(r.a, 3), y25: ytd(r.a, 2), y24: ytd(r.a, 1), y23: ytd(r.a, 0)})).sort((x, y) => (y.y26 - y.y25) - (x.y26 - x.y25));
  const T = {y26: ytd(totA, 3), y25: ytd(totA, 2), y24: ytd(totA, 1), y23: ytd(totA, 0)};
  let t = '<table class="t"><tr><th style="width:24%">' + nameHdr + '</th><th>YTD 26</th><th>Δ vs 25</th><th>vs 25</th><th>vs 24</th><th>vs 23</th><th>Mix 26</th><th>Δ mix</th>' + (extraCols ? extraCols.h : '') + '</tr>';
  const row = (r, tt) => '<tr' + (tt ? ' class="tt"' : '') + '><td>' + r.n + '</td><td>' + k1(r.y26) + '</td><td class="' + (r.y26 >= r.y25 ? 'up' : 'dn') + '">' + sk(r.y26 - r.y25) + '</td>' +
    [r.y25, r.y24, r.y23].map(p => p >= 1 ? '<td class="' + (r.y26 >= p ? 'up' : 'dn') + '">' + pcs(r.y26, p) + '</td>' : '<td class="mut">nuevo</td>').join('') +
    '<td>' + (r.y26 / T.y26 * 100).toFixed(1) + '%</td><td>' + (tt ? '' : ppx((r.y26 / T.y26 - r.y25 / T.y25) * 100)) + '</td>' + (extraCols ? extraCols.f(r, tt) : '') + '</tr>';
  data.forEach(r => t += row(r));
  t += row(Object.assign({n: 'Total Dirección'}, T), true) + '</table>';
  bodyOf(s).innerHTML = '<div class="cols" style="grid-template-columns:0.85fr 1.6fr;gap:18px">' +
    col(bar || 'Δ mil HL vs YTD 2025', '<div class="box" style="height:' + 360 + 'px"><canvas></canvas></div>') + '<div>' + t + '<div class="cap">Mil HL · YTD Ene–Oct · Mix = peso sobre el total Beer+Rtds de la Dirección · Δ mix en puntos porcentuales vs YTD 25.</div><div class="pbul" style="margin-top:12px"></div></div></div>';
  if (msg) bodyOf(s).insertAdjacentHTML('beforeend', '<div class="bar"><b>' + msg[0] + '</b>' + msg[1] + '</div>');
  const dd = data.map(r => r.y26 - r.y25);
  new Chart(s.querySelector('canvas'), {type: 'bar', data: {labels: data.map(r => r.n), datasets: [{data: dd, backgroundColor: dd.map(v => v >= 0 ? '#111' : '#c62828'), barThickness: 22}]},
    options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false, layout: {padding: {left: 4, right: 10}}, plugins: {legend: {display: false}, tooltip: {enabled: false}},
      scales: {x: {display: false, min: Math.min(0, ...dd) * 2.6, max: Math.max(...dd) * 2.1}, y: {grid: {display: false}, ticks: {font: {size: 12.5, weight: 600}, color: '#111'}}}},
    plugins: [VALPLUG((v, d, i) => sk(v) + ' (' + (data[i].y25 >= 1 ? pcs(data[i].y26, data[i].y25) : 'nuevo') + ')', v => v >= 0 ? '#0f7b3e' : '#c62828')]});
  return s;
}
